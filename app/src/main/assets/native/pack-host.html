<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>蓝鳍</title>
<style>
html,body{height:100%;margin:0;background:transparent;overflow:hidden;color-scheme:light}
#wrap{height:100%;width:100%}
#stage{position:fixed;inset:0;overflow:hidden;background:transparent;touch-action:none;user-select:none;-webkit-user-select:none}
#root{position:absolute;inset:0}
#pack-error{position:fixed;z-index:5;left:16px;right:16px;top:72px;display:none;padding:12px 14px;border-radius:14px;
  background:rgba(255,255,255,.92);border:1px solid #f1b6b0;color:#7c2d28;font:13px/1.5 "PingFang SC","Noto Sans SC",sans-serif;
  box-shadow:0 8px 24px rgba(20,40,70,.12)}
</style>
</head>
<body>
<main id="wrap">
  <div id="stage"><div id="root"></div></div>
</main>
<div id="pack-error" role="status"></div>
<script type="module" src="pack-host.js"></script>
</body>
</html>
