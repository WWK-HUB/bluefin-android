# Bluefin (鳍遇) cloud TTS proxy — Fish Audio s2.1-pro-free only.
#
# Deployed as Cloudflare PAGES advanced mode (_worker.js): identical Worker
# code, but *.pages.dev is directly reachable from mainland networks where
# *.workers.dev is DNS-poisoned. End users need no proxy and no custom domain.
#
# Secrets (set with `wrangler pages secret put <NAME> --project-name bluefin-tts`):
#   FISH_API_KEY       your Fish Audio API key (server-side only)
#   TOKEN_SIGNING_KEY  random 32+ bytes, signs device session tokens
#   ADMIN_TOKEN        random 32+ bytes, protects /admin/* routes
#
# Build:  npm run build:pages   (esbuild → dist-pages/_worker.js)
# Deploy: npx wrangler pages deploy dist-pages --project-name bluefin-tts --branch main
# Local:  npx wrangler pages dev dist-pages   (keyless tests: node test/integration.mjs)

name = "bluefin-tts"
pages_build_output_dir = "dist-pages"
compatibility_date = "2025-09-01"
compatibility_flags = ["enable_request_signal"]

[vars]
# Fair-use guards. All are deployer config; clients can never override them.
MAX_TEXT_CHARS = "500"
DEVICE_DAILY_CHARS = "20000"
DEVICE_RATE_MAX = "12"
DEVICE_RATE_WINDOW_MS = "60000"
GLOBAL_CONCURRENCY = "4"
MAX_DEVICES = "100"
REGISTER_PER_IP_DAILY = "5"
MAX_VOICES_PER_DEVICE = "20"
MAX_AUDIO_BYTES = "4194304"
UPSTREAM_TIMEOUT_MS = "30000"
TOKEN_TTL_SECONDS = "604800"
PROBE_MIN_INTERVAL_MS = "60000"
VOICE_RETENTION_ENABLED = "false"

[[kv_namespaces]]
binding = "VOICES"
id = "8e005d922e9242aa8092c30e24403b8a"

[[durable_objects.bindings]]
name = "GATE"
class_name = "Gate"
# Bind to the Gate class hosted by the companion Worker "bluefin-tts"
# (wrangler-worker.toml), where the SQLite migration is applied. Pages and
# Workers endpoints therefore share one registry/quota state.
script_name = "bluefin-tts"
